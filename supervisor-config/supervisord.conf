[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisor/supervisord.pid
nodaemon=true

[unix_http_server]
file=/var/run/supervisor/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# HDFS NameNode
[program:hdfs-namenode]
command=/opt/hadoop/bin/hdfs namenode
autostart=true
autorestart=true
stdout_logfile=/var/log/hadoop/namenode.log
stderr_logfile=/var/log/hadoop/namenode_error.log
user=root
priority=1

# HDFS DataNode
[program:hdfs-datanode]
command=/opt/hadoop/bin/hdfs datanode
autostart=true
autorestart=true
stdout_logfile=/var/log/hadoop/datanode.log
stderr_logfile=/var/log/hadoop/datanode_error.log
user=root
priority=2

# YARN ResourceManager
[program:yarn-resourcemanager]
command=/opt/hadoop/bin/yarn resourcemanager
autostart=true
autorestart=true
stdout_logfile=/var/log/hadoop-yarn/resourcemanager.log
stderr_logfile=/var/log/hadoop-yarn/resourcemanager_error.log
user=root
priority=3

# YARN NodeManager
[program:yarn-nodemanager]
command=/opt/hadoop/bin/yarn nodemanager
autostart=true
autorestart=true
stdout_logfile=/var/log/hadoop-yarn/nodemanager.log
stderr_logfile=/var/log/hadoop-yarn/nodemanager_error.log
user=root
priority=4

# Spark Master
[program:spark-master]
command=/bin/bash -c "cd /opt/spark && exec java -cp 'conf:jars/*' -Xmx1g org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/spark-master.log
stderr_logfile=/var/log/supervisor/spark-master_error.log
user=root
priority=5
startsecs=10
stopasgroup=true
stopmethod=KILL
